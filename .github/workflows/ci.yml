name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: engineering_worker
          POSTGRES_USER: engineering_worker
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engineering_worker -d engineering_worker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check app migrations tests ../scripts
      - name: Format check
        run: uv run ruff format --check app migrations tests ../scripts
      - name: Type check
        run: uv run mypy app ../scripts/validate_real_workflow.py ../scripts/rotate_credentials.py
      - name: Apply database migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://engineering_worker:ci-password@localhost:5432/engineering_worker
        run: uv run alembic upgrade head
      - name: Test
        env:
          SCHEDULER_ENABLED: "false"
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  # Browser/deployment validation is intentionally disabled until a stable
  # deployment environment is configured. Keep CI focused on deterministic
  # code-quality, migration, build, and unit-test checks for now.

  quality-gate:
    name: Quality gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
