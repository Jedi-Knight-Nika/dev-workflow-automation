name: autonomous-engineering-worker

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineering_worker}
      POSTGRES_USER: ${POSTGRES_USER:-engineering_worker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://engineering_worker:change-me@postgres:5432/engineering_worker}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://engineering_worker:change-me@postgres:5432/engineering_worker}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-secret-change-me}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
      GITHUB_APP_RETURN_URL: ${GITHUB_APP_RETURN_URL:-http://localhost:3000/repositories}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      WORKSPACE_ROOT: /data/workspaces
      SCHEDULER_ENABLED: "false"
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-1.0}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-300}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-330}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      MAX_EXECUTOR_JOBS_PER_TASK: ${MAX_EXECUTOR_JOBS_PER_TASK:-5}
      MAX_THINKER_JOBS_PER_TASK: ${MAX_THINKER_JOBS_PER_TASK:-3}
      MAX_SAME_FINDING_REPEATS: ${MAX_SAME_FINDING_REPEATS:-2}
      MAX_CI_REPAIRS_PER_TASK: ${MAX_CI_REPAIRS_PER_TASK:-3}
      MAX_EXTERNAL_REVIEW_REPAIRS_PER_TASK: ${MAX_EXTERNAL_REVIEW_REPAIRS_PER_TASK:-3}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-5}
      WORKER_TRANSPORT: local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - workspaces:/data/workspaces
      - ${GITHUB_APP_PRIVATE_KEY_FILE_HOST:-./github-app.private-key.pem}:/run/secrets/github_app_private_key:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://engineering_worker:change-me@postgres:5432/engineering_worker}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql+psycopg://engineering_worker:change-me@postgres:5432/engineering_worker}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-secret-change-me}
      WORKSPACE_ROOT: /data/workspaces
      SCHEDULER_ENABLED: "true"
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-1.0}
      WORKER_TIMEOUT_SECONDS: ${WORKER_TIMEOUT_SECONDS:-300}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-330}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
      MAX_EXECUTOR_JOBS_PER_TASK: ${MAX_EXECUTOR_JOBS_PER_TASK:-5}
      MAX_THINKER_JOBS_PER_TASK: ${MAX_THINKER_JOBS_PER_TASK:-3}
      MAX_SAME_FINDING_REPEATS: ${MAX_SAME_FINDING_REPEATS:-2}
      MAX_CI_REPAIRS_PER_TASK: ${MAX_CI_REPAIRS_PER_TASK:-3}
      MAX_EXTERNAL_REVIEW_REPAIRS_PER_TASK: ${MAX_EXTERNAL_REVIEW_REPAIRS_PER_TASK:-3}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-5}
      WORKER_TRANSPORT: local
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - workspaces:/data/workspaces
    init: true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://backend:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  workspaces:
