global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['prometheus:9090']}]
  - job_name: backend
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs: [{targets: ['backend:8000']}]
  - job_name: worker-controller
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs: [{targets: ['worker:8001']}]
    # DB mirror is already exported by backend. Keep worker liveness only.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'aew_ai_.*|aew_tasks_.*|aew_scheduler_.*|aew_active_.*'
        action: drop
  - job_name: cadvisor
    scrape_interval: 10s
    sample_limit: 30000
    static_configs: [{targets: ['cadvisor:8080']}]
    metric_relabel_configs:
      - action: labelkeep
        regex: '__name__|id|name|container_label_com_docker_compose_service|device|interface|cpu|job|instance|scope|failure_type|operation|major|minor|state|type'
  - job_name: node-exporter
    scrape_interval: 10s
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: postgres-exporter
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: blackbox-exporter
    static_configs: [{targets: ['blackbox-exporter:9115']}]
  - job_name: availability
    scrape_interval: 30s
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ['http://frontend:3000/']
        labels: {service: frontend}
      - targets: ['http://backend:8000/health/ready']
        labels: {service: backend-readiness}
      - targets: ['http://backend:8000/health/live']
        labels: {service: backend-liveness}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
    metric_relabel_configs:
      - action: labeldrop
        regex: 'instance'
