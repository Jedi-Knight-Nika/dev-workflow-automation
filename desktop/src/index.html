<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Engineering Worker</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container" aria-labelledby="status">
      <div class="loader" aria-hidden="true">
        <span class="diamond diamond--outer"></span>
        <span class="diamond diamond--inner"></span>
      </div>
      <section class="loading-copy">
        <h1 id="status">Preparing your workspace</h1>
        <p id="hint">
          Getting everything ready for you. This may take a moment on first
          launch.
        </p>
      </section>
    </main>
  </body>
</html>
