<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      try {
        const stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
      try {
        const storedLocale = localStorage.getItem('locale');
        if (storedLocale === 'en' || storedLocale === 'ka') {
          document.documentElement.lang = storedLocale;
        } else if (navigator.language.toLowerCase().startsWith('ka')) {
          document.documentElement.lang = 'ka';
        }
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Autonomous Engineering Worker control center" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
